<DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-witdth, initial-scale=1.0">
<title>weather </title>

</head>

<body>
    {% if user.is_authenticated %}   
        <a href="{% url 'add_city' %}">Add City</a>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %} 
            <input type="submit" value="logging out" >
        </form>
    {% else %}
        <form method="get" action="{% url 'login' %}">
            <input type="submit" value="login">
        </form>    
    {% endif %}

    <h1>weather brodcas website</h1>
    {% if temp %}
    <h2>{{city}} {{temp}}  degree today</h2>
    {% else %}
        <h2>Error fetching data from {{city}}</h2>
    {% endif %}

    <a href="{% url 'city_list' %}"> Cities </a>
</body>
</html>
