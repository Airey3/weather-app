<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City List</title>
</head>

<body>
    <h1>City List</h1>

    {% for item in cities %}
    <div style="margin:10px;">
        <a href="{% url 'home' %}?id={{ item.id }}">{{item.title}}</a>
        
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'delete_city' %}" style="display:inline">
                {% csrf_token %}
                <button type="submit" name="id" value="{{ item.id }}">delete</button>
            </form>
        {% endif %}

    </div>
    {% endfor %}  

</body>

</html>
